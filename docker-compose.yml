services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ledgerguard:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LG_DB_USER: ${LG_DB_USER}
      LG_DB_PASSWORD: ${LG_DB_PASSWORD}
      RELAY_DB_USER: ${RELAY_DB_USER}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD}
      DOCUMIND_DB_USER: ${DOCUMIND_DB_USER}
      DOCUMIND_DB_PASSWORD: ${DOCUMIND_DB_PASSWORD}
      AERO_DB_USER: ${AERO_DB_USER}
      AERO_DB_PASSWORD: ${AERO_DB_PASSWORD}
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  ledgerguard:
    image: ghcr.io/duvalkwali/ledgerguard:latest
    build:
      context: ../ledgerguard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerguard
      SPRING_DATASOURCE_USERNAME: ${LG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${LG_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
